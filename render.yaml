services:
  - type: web
    name: occu-med-insight-hub
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/db run push && pnpm --filter @workspace/occu-med-insight-hub run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: BASE_PATH
        value: /
      # External Postgres/Neon connection string.
      # Set this in the Render dashboard; do not commit database credentials.
      - key: DATABASE_URL
        sync: false
      # --- Third-party API keys (set values in Render dashboard, never in code) ---
      - key: APIFY_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false
      # General LangSearch keys remain available to geographic and employer-intelligence discovery.
      - key: LANGSEARCH_API_KEY
        sync: false
      - key: LANGSEARCH_API_KEY_2
        sync: false
      # Dedicated organizational-structure discovery keys, used first with rotation and failover.
      - key: LANGSEARCH_API_KEY_3
        sync: false
      - key: LANGSEARCH_API_KEY_4
        sync: false
      # Public browser token embedded by Vite at build time for the Mapbox basemap.
      - key: VITE_MAPBOX_ACCESS_TOKEN
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OLOSTEP_API_KEY
        sync: false
      - key: YOU_API_KEY
        sync: false
      - key: ONET_API_KEY
        sync: false
      - key: FEC_API_KEY
        sync: false
      # --- AOR Risk Intelligence ---
      - key: ACLED_USERNAME
        sync: false
      - key: ACLED_PASSWORD
        sync: false
      # --- Employer Intelligence Module env vars ---
      - key: BLS_API_KEY
        sync: false
      - key: BLS_IMPORT_ENABLED
        sync: false
      - key: SAM_API_KEY
        sync: false
      - key: COURTLISTENER_API_TOKEN
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: OSHA_ITA_IMPORT_ENABLED
        sync: false
      - key: OSHA_DATA_DIR
        sync: false
      - key: WORKERS_COMP_SOURCE_INDEX_ENABLED
        sync: false
      - key: USASPENDING_API_ENABLED
        sync: false
      # --- HHS / HealthData.gov Catalog ---
      - key: HHS_SOCRATA_APP_TOKEN
        sync: false
      - key: HHS_CATALOG_ENABLED
        sync: false
      - key: HHS_CATALOG_DOMAIN
        sync: false
      # --- CMS Provider Data Catalog ---
      - key: CMS_PROVIDER_DATA_ENABLED
        sync: false
      - key: CMS_PROVIDER_DATA_BASE_URL
        sync: false
      - key: CMS_DATA_API_KEY
        sync: false
      # --- BLS hardened connector ---
      - key: BLS_AUTH_MODE
        sync: false
      - key: BLS_SERIES_MAPPING_ENABLED
        sync: false

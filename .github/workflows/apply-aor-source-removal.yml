name: Apply AOR source removal

on:
  push:
    branches:
      - agent/remove-pending-aor-sources-enable-acled

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-pending-aor-sources-enable-acled
          fetch-depth: 0

      - name: Remove declined AOR sources
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          backend_path = Path("artifacts/api-server/src/routes/aor-risk-intelligence.ts")
          backend = backend_path.read_text()

          backend, count = re.subn(
              r'\nfunction nested\(record: JsonRecord \| null, \.\.\.path: string\[\]\): unknown \{[\s\S]*?\n\}\n\n(?=router\.get\("/aor/health-outbreaks")',
              "\n",
              backend,
              count=1,
          )
          assert count == 1, "Could not remove ReliefWeb-only nested helper"

          backend, count = re.subn(
              r'\nrouter\.get\("/aor/reliefweb-health"[\s\S]*?\n\}\);\n\n(?=async function requestAcledToken)',
              "\n",
              backend,
              count=1,
          )
          assert count == 1, "Could not remove ReliefWeb route"

          for source_id in ("reliefweb", "ucdp", "firms"):
              backend, count = re.subn(
                  rf'\n\s*\{{ id: "{source_id}".*?\}},',
                  "",
                  backend,
                  count=1,
              )
              assert count == 1, f"Could not remove {source_id} readiness entry"

          for forbidden in (
              "RELIEFWEB_APPNAME",
              "/aor/reliefweb-health",
              "UCDP_API_TOKEN",
              "NASA_FIRMS_MAP_KEY",
              'id: "reliefweb"',
              'id: "ucdp"',
              'id: "firms"',
              "Healthsites",
          ):
              assert forbidden not in backend, f"Backend still contains removed source marker: {forbidden}"

          backend_path.write_text(backend)

          frontend_path = Path("artifacts/occu-med-insight-hub/src/pages/aor-risk-intelligence.tsx")
          frontend = frontend_path.read_text()

          exact_removals = (
              "  ExternalLink,\n",
              "  FileText,\n",
              "  Globe2,\n",
              '  { id: "humanitarian", label: "Humanitarian" },\n',
              "  reliefweb: SourceResult;\n",
              "  reliefweb: emptyResult(),\n",
              '      runSource("reliefweb", `/api/aor/reliefweb-health?country=${encoded}`),\n',
              "  const reports = sources.reliefweb.data?.reports || [];\n",
          )
          for old in exact_removals:
              assert old in frontend, f"Expected frontend text not found: {old!r}"
              frontend = frontend.replace(old, "", 1)

          old_subtitle = 'subtitle="Country-level travel, health-crisis, disaster, conflict, and humanitarian context from separately attributed public sources."'
          new_subtitle = 'subtitle="Country-level travel, health-crisis, disaster, and conflict context from separately attributed public sources."'
          assert old_subtitle in frontend, "AOR subtitle changed unexpectedly"
          frontend = frontend.replace(old_subtitle, new_subtitle, 1)

          old_boundary = "Each source remains separate because travel guidance, outbreak reports, conflict events, humanitarian reports, and disaster alerts use different definitions and update cycles. The workspace surfaces evidence and freshness rather than converting unlike sources into one misleading score."
          new_boundary = "Each source remains separate because travel guidance, outbreak reports, conflict events, and disaster alerts use different definitions and update cycles. The workspace surfaces evidence and freshness rather than converting unlike sources into one misleading score."
          assert old_boundary in frontend, "Interpretation boundary changed unexpectedly"
          frontend = frontend.replace(old_boundary, new_boundary, 1)

          frontend, count = re.subn(
              r'\n        \{activeTab === "humanitarian" && \([\s\S]*?\n        \)\}\n\n(?=        <div className="mt-8)',
              "\n",
              frontend,
              count=1,
          )
          assert count == 1, "Could not remove Humanitarian tab content"

          for forbidden in (
              "reliefweb",
              '"humanitarian"',
              "FileText",
              "Globe2",
              "ExternalLink",
              "UCDP",
              "NASA FIRMS",
              "Healthsites",
          ):
              assert forbidden not in frontend, f"Frontend still contains removed source marker: {forbidden}"

          frontend_path.write_text(frontend)
          PY

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate repository
        run: |
          pnpm run audit:repository
          pnpm run typecheck
          pnpm run build

      - name: Commit source cleanup
        run: |
          rm -f .github/workflows/apply-aor-source-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove declined AOR source integrations"
          git push origin HEAD:agent/remove-pending-aor-sources-enable-acled

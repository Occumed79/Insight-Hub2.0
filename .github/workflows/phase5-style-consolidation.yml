name: Phase 5 Style Consolidation

on:
  push:
    branches:
      - agent/phase-5-style-consolidation

permissions:
  contents: write

jobs:
  consolidate-and-validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
      BASE_PATH: /
    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5-style-consolidation
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Consolidate the style system
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path.cwd()
          src = root / "artifacts/occu-med-insight-hub/src"
          styles = src / "styles"
          styles.mkdir(exist_ok=True)

          index_path = src / "index.css"
          visual_path = src / "visual-restore.css"
          logo_path = src / "logo-override.css"
          map_path = src / "map-polish.css"
          cinema_path = src / "cinematic-system.css"
          viz_path = src / "pages/data-visualization.tsx"
          main_path = src / "main.tsx"

          index_css = index_path.read_text()
          visual_css = visual_path.read_text()
          logo_css = logo_path.read_text()
          map_css = map_path.read_text()
          cinema_css = cinema_path.read_text()
          viz_text = viz_path.read_text()

          widget_hack = "/* Hide injected right-edge preview/dev widgets that are not part of the app shell. */"
          aurora_marker = ".aurora-bg {"
          if widget_hack not in index_css or aurora_marker not in index_css:
              raise SystemExit("Unable to identify the foundation/application split in index.css")

          foundation = index_css[:index_css.index(widget_hack)].rstrip()
          application_core = index_css[index_css.index(aurora_marker):].strip()

          tokens = r'''

          /* Insight Hub 2.0 visual tokens — one source of truth for the dark glass system. */
          :root,
          .dark {
            --surface-page: #030813;
            --surface-page-deep: #03020e;
            --surface-panel: rgba(7, 17, 29, 0.62);
            --surface-panel-strong: rgba(4, 13, 26, 0.94);
            --surface-panel-soft: rgba(255, 255, 255, 0.03);
            --border-luminous: rgba(103, 232, 249, 0.16);
            --border-luminous-strong: rgba(125, 211, 252, 0.22);
            --text-luminous: rgba(236, 254, 255, 0.92);
            --text-luminous-muted: rgba(207, 250, 254, 0.56);
            --accent-cyan: #22d3ee;
            --accent-cyan-soft: #67e8f9;
            --accent-green: #34d399;
            --accent-violet: #a78bfa;
            --glass-blur: 22px;
            --glass-saturation: 1.2;
            --glass-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 24px 80px rgba(0,0,0,0.28), 0 0 0 1px rgba(103,232,249,0.06);
            --cinema-bg: var(--surface-page);
            --cinema-panel: var(--surface-panel);
            --cinema-border: var(--border-luminous);
            --cinema-text: var(--text-luminous);
            --cinema-muted: var(--text-luminous-muted);
            --cinema-cyan: var(--accent-cyan);
            --cinema-green: var(--accent-green);
            --cinema-violet: var(--accent-violet);
          }
          '''
          foundation = foundation + tokens

          # The cinematic variables now alias the shared token system.
          cinema_css = re.sub(
              r"/\* Shared cinematic system: automatic effects, no user-facing lens picker\. \*/\s*:root\s*\{.*?\}\s*",
              "/* Shared cinematic component system. */\n",
              cinema_css,
              count=1,
              flags=re.S,
          )

          # These selectors targeted components that no longer exist and only hid old prototype output.
          cinema_css = re.sub(
              r"/\* The 22 effects are internal visual primitives\. Hide the accidental lens-picker scene\. \*/.*?/\* Shared Apple-style shell",
              "/* Shared Apple-style shell",
              cinema_css,
              count=1,
              flags=re.S,
          )

          # Keep broad glass treatment inside app surfaces rather than styling arbitrary bordered elements globally.
          cinema_css = cinema_css.replace(
              '[class*="rounded-xl"][class*="border"][class*="bg-black"],\n[class*="rounded-2xl"][class*="border"]',
              '.aurora-bg [class*="rounded-xl"][class*="border"][class*="bg-black"],\n.aurora-bg [class*="rounded-2xl"][class*="border"]',
          )

          # Pull the cinematic page CSS out of React and into the audited stylesheet.
          function_start = viz_text.find("function StyleInjector()")
          export_start = viz_text.find("export default function DataVisualization()", function_start)
          style_start = viz_text.find("<style>{`", function_start)
          style_end = viz_text.find("`}</style>", style_start)
          if min(function_start, export_start, style_start, style_end) < 0:
              raise SystemExit("Unable to extract StyleInjector from data-visualization.tsx")
          inline_css = viz_text[style_start + len("<style>{`"):style_end].strip()
          viz_text = viz_text[:function_start] + viz_text[export_start:]
          viz_text = viz_text.replace("      <StyleInjector />\n", "")
          if "StyleInjector" in viz_text or "<style>" in viz_text:
              raise SystemExit("Component-injected CSS remains after extraction")

          application = """/* Insight Hub 2.0 application visual system.\n   Cascade order is preserved from the former patch files, but all app-level rules now live in one audited layer. */\n\n"""
          sections = [
              ("Aurora and map structural rules", application_core),
              ("Final aurora and glass treatment", visual_css.strip()),
              ("Landing wordmark", logo_css.strip()),
              ("Leaflet visual treatment", map_css.strip()),
              ("Shared cinematic component system", cinema_css.strip()),
              ("Data Visualization page", inline_css),
          ]
          for title, css in sections:
              application += f"/* {title} */\n{css}\n\n"

          (styles / "foundation.css").write_text(foundation.rstrip() + "\n")
          (styles / "application.css").write_text(application.rstrip() + "\n")
          viz_path.write_text(viz_text)
          main_path.write_text('''import { createRoot } from "react-dom/client";\nimport App from "./App";\nimport "./styles/foundation.css";\nimport "leaflet/dist/leaflet.css";\nimport "./styles/application.css";\n\ncreateRoot(document.getElementById("root")!).render(<App />);\n''')

          for obsolete in [index_path, visual_path, logo_path, map_path, cinema_path]:
              obsolete.unlink()

          audit_path = root / "scripts/repository-audit.mjs"
          audit = audit_path.read_text()
          css_function = '''\nfunction countComponentInjectedStyles(allFiles) {\n  const matches = [];\n  for (const rel of allFiles.filter((f) => f.startsWith(`${FRONTEND_ROOT}/`) && /\\.(tsx|jsx)$/.test(f))) {\n    let text;\n    try { text = fs.readFileSync(path.join(root, rel), 'utf8'); } catch { continue; }\n    if (/<style(?:\\s|>)/.test(text)) matches.push(rel);\n  }\n  return matches;\n}\n'''
          anchor = "function countCssLayers() {"
          if "function countComponentInjectedStyles" not in audit:
              audit = audit.replace(anchor, css_function + "\n" + anchor)
          audit = audit.replace(
              "const cssLayers = countCssLayers();\nconst coordinateIssues = scanCoordinates(files);",
              "const cssLayers = countCssLayers();\nconst componentInjectedStyles = countComponentInjectedStyles(files);\nconst coordinateIssues = scanCoordinates(files);",
          )
          audit = audit.replace(
              "  globalCssLayers: cssLayers,\n  invalidCoordinateCount:",
              "  globalCssLayers: cssLayers,\n  componentInjectedStyleCount: componentInjectedStyles.length,\n  componentInjectedStyles,\n  invalidCoordinateCount:",
          )
          audit = audit.replace(
              "      ['globalCssLayerCount', report.globalCssLayerCount],\n      ['invalidCoordinateCount',",
              "      ['globalCssLayerCount', report.globalCssLayerCount],\n      ['componentInjectedStyleCount', report.componentInjectedStyleCount],\n      ['invalidCoordinateCount',",
          )
          audit = audit.replace(
              "  console.log(`Global CSS layers: ${report.globalCssLayerCount}`);\n  console.log(`Invalid coordinate literals:",
              "  console.log(`Global CSS layers: ${report.globalCssLayerCount}`);\n  console.log(`Component-injected style files: ${report.componentInjectedStyleCount}`);\n  console.log(`Invalid coordinate literals:",
          )
          audit_path.write_text(audit)

          baseline_path = root / "docs/repository-cleanup-baseline.json"
          baseline = json.loads(baseline_path.read_text())
          baseline["description"] = "Phase 5 structural-debt ceiling after consolidating the visual system. Values may be lowered by later cleanup PRs but must not be increased without an explicit review explanation."
          baseline["maximums"]["totalFiles"] = 288  # includes this one-time workflow during validation
          baseline["maximums"]["globalCssLayerCount"] = 3
          baseline["maximums"]["componentInjectedStyleCount"] = 0
          required = baseline.setdefault("requiredFiles", [])
          for item in [
              "artifacts/occu-med-insight-hub/src/styles/foundation.css",
              "artifacts/occu-med-insight-hub/src/styles/application.css",
          ]:
              if item not in required:
                  required.append(item)
          forbidden = baseline.setdefault("forbiddenNewPatterns", [])
          old_css_pattern = r"^artifacts/occu-med-insight-hub/src/(index|visual-restore|logo-override|map-polish|cinematic-system)\\.css$"
          if old_css_pattern not in forbidden:
              forbidden.append(old_css_pattern)
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n")

          manifest_path = root / "docs/repository-cleanup-manifest.md"
          manifest_path.write_text('''# Insight Hub 2.0 Repository Cleanup Manifest\n\n## Purpose\n\nThis file controls the staged cleanup of Insight Hub 2.0. Cleanup must proceed through isolated pull requests, preserve production behavior, and lower—never silently raise—the repository integrity baseline.\n\n## Phase status\n\n- **Phase 1 — safety and inventory:** complete in PR #29.\n- **Phase 2 — proven garbage removal:** complete in PR #30.\n- **Phase 3 — canonical data spine:** complete in PR #31.\n- **Phase 4 — visualization validity:** complete in PR #32.\n- **Phase 5 — style consolidation:** implemented in the current pull request.\n- **Phase 6 — shared-data security:** pending.\n\n## Canonical data path\n\n`seed -> configuration registry -> uploaded workbooks -> curated dossiers -> uploaded report replacements -> live intelligence`\n\n## Phase 5 visual architecture\n\nThe frontend now has one explicit style order:\n\n`foundation.css -> Leaflet vendor CSS -> application.css`\n\n- `foundation.css` owns Tailwind integration, semantic theme values, typography, base elements, and the unified dark-glass token system.\n- `application.css` owns the aurora field, liquid-glass cards, landing page, map treatment, cinematic components, and Data Visualization page styles.\n- the five former patch files are removed;\n- the React-injected cinematic `<style>` block is removed;\n- broad CSS that hid arbitrary fixed-position widgets is removed;\n- old selectors that hid already-removed prototype components are removed;\n- broad utility matching is scoped beneath `.aurora-bg`;\n- CI now prevents the global import stack from growing beyond three layers and prevents component-injected style tags from returning.\n\n## Visual preservation rule\n\nThe consolidation preserves the existing dark navy palette, luminous cyan/emerald/violet accents, aurora depth, liquid-glass cards, landing logo sizing, Leaflet presentation, cinematic panels, motion behavior, and reduced-motion fallback. Phase 5 changes ownership and cascade structure rather than redesigning the interface.\n\n## Keep: production-critical\n\nProduction entrypoints, live routes, reachable components, API services, database schemas, migrations, Render configuration, company data, and uploaded source material remain protected.\n\n## Remaining phase\n\n### Phase 6: shared-data security\n\nRequire authenticated, role-protected access for portal-link changes, entity verification, location imports, and intelligence ingestion.\n\n## Review rule\n\nEvery cleanup pull request must state what it removes or replaces, how production behavior was validated, how the baseline changed, and whether data or visual behavior changed.\n''')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository integrity audit
        run: pnpm run audit:repository

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build

      - name: Finalize clean branch
        run: |
          rm .github/workflows/phase5-style-consolidation.yml
          python <<'PY'
          from pathlib import Path
          import json
          path = Path("docs/repository-cleanup-baseline.json")
          baseline = json.loads(path.read_text())
          baseline["maximums"]["totalFiles"] = 287
          path.write_text(json.dumps(baseline, indent=2) + "\n")
          PY
          pnpm run audit:repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate the Insight Hub style system"
          git push origin HEAD:agent/phase-5-style-consolidation

name: Fix sidebar overflow

on:
  push:
    paths:
      - .github/workflows/fix-sidebar-overflow.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair sidebar navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/occu-med-insight-hub/src/components/insight/Sidebar.tsx')
          text = path.read_text()
          text = text.replace(
              '  { href: "/injury-workforce-exposure", label: "Injury & Exposure", icon: Grid3X3 },\n  { href: "/corporate-signals", label: "Corporate Signals", icon: RadioTower },\n  { href: "/sec-filings", label: "SEC Filings", icon: FileSearch },\n  { href: "/workers-comp-coverage", label: "Workers’ Comp Coverage", icon: ClipboardList },\n  { href: "/dba-intelligence", label: "DBA Data Hub", icon: ShieldCheck },',
              '  { href: "/dba-intelligence", label: "DBA Data Hub", icon: ShieldCheck },\n  { href: "/injury-workforce-exposure", label: "Injury & Exposure", icon: Grid3X3 },\n  { href: "/corporate-signals", label: "Corporate Signals", icon: RadioTower },\n  { href: "/sec-filings", label: "SEC Filings", icon: FileSearch },\n  { href: "/workers-comp-coverage", label: "Workers’ Comp Coverage", icon: ClipboardList },',
              1,
          )
          text = text.replace(
              'fixed left-0 top-0 z-30 hidden h-screen w-[210px]',
              'fixed left-0 top-0 z-30 hidden h-screen w-[210px] overflow-y-auto overscroll-contain',
              1,
          )
          text = text.replace('      <div className="mt-8">', '      <div className="mt-8 pb-8">', 1)
          path.write_text(text)
          Path('.github/workflows/fix-sidebar-overflow.yml').unlink()
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep DBA Data Hub visible and make sidebar scrollable"
          git push origin HEAD:main

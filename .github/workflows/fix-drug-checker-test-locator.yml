name: Fix Drug Checker Browser Locator

on:
  push:
    branches:
      - fix/drug-checker-live-intelligence

permissions:
  contents: write

jobs:
  fix-locator:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/drug-checker-live-intelligence
          fetch-depth: 0
      - name: Make FDA label assertion exact
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/occu-med-insight-hub/tests/occupational-intelligence.spec.ts')
          text = path.read_text()
          old = 'page.getByText("FDA label intelligence")'
          new = 'page.getByText("04 · FDA label intelligence", { exact: true })'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 ambiguous assertions, found {count}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/fix-drug-checker-test-locator.yml
      - name: Commit locator fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/occu-med-insight-hub/tests/occupational-intelligence.spec.ts .github/workflows/fix-drug-checker-test-locator.yml
          git commit -m "Fix Drug Checker browser assertions"
          git push origin HEAD:fix/drug-checker-live-intelligence

name: Apply Mapbox and LangSearch integrations

on:
  push:
    branches:
      - agent/mapbox-langsearch-integration

permissions:
  contents: write

jobs:
  apply-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mapbox-langsearch-integration
          fetch-depth: 0
      - name: Wire Mapbox and dual-key LangSearch
        run: |
          python - <<'PY'
          from pathlib import Path

          map_path = Path('artifacts/occu-med-insight-hub/src/pages/geographic-data.tsx')
          text = map_path.read_text()
          old = '''                <TileLayer
                  attribution='Tiles &copy; <a href="https://www.esri.com/">Esri</a> — Esri, TomTom, Garmin, FAO, NOAA, USGS, OpenStreetMap contributors, and the GIS User Community'
                  url="https://services.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
                />'''
          new = '''                {import.meta.env.VITE_MAPBOX_ACCESS_TOKEN ? (
                  <TileLayer
                    attribution='&copy; <a href="https://www.mapbox.com/about/maps/">Mapbox</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                    url={`https://api.mapbox.com/styles/v1/mapbox/outdoors-v12/tiles/256/{z}/{x}/{y}@2x?access_token=${encodeURIComponent(import.meta.env.VITE_MAPBOX_ACCESS_TOKEN)}`}
                    tileSize={256}
                  />
                ) : (
                  <TileLayer
                    attribution='Tiles &copy; <a href="https://www.esri.com/">Esri</a> — Esri, TomTom, Garmin, FAO, NOAA, USGS, OpenStreetMap contributors, and the GIS User Community'
                    url="https://services.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
                  />
                )}'''
          if old not in text:
              raise SystemExit('Expected Esri TileLayer block was not found')
          map_path.write_text(text.replace(old, new, 1))

          location_path = Path('artifacts/api-server/src/lib/companyLocationDiscovery.ts')
          text = location_path.read_text()
          tavily_block = '''async function searchTavily(query: string, apiKey: string): Promise<SearchResult[]> {
  const response = await fetch("https://api.tavily.com/search", {
    method: "POST",
    headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
    body: JSON.stringify({ query, max_results: 10, include_answer: false, search_depth: "advanced" }),
  });
  if (!response.ok) throw new Error(`Tavily HTTP ${response.status}`);
  const data = await response.json() as { results?: Array<{ title?: string; url?: string; content?: string }> };
  return (data.results || []).map((item) => ({ title: String(item.title || ""), url: String(item.url || ""), snippet: String(item.content || ""), provider: "tavily" }));
}
'''
          langsearch_block = tavily_block + '''
async function searchLangSearch(query: string): Promise<SearchResult[]> {
  const keys = [process.env.LANGSEARCH_API_KEY, process.env.LANGSEARCH_API_KEY_2]
    .map((key) => key?.trim())
    .filter((key): key is string => Boolean(key));
  if (keys.length === 0) throw new Error("LangSearch is not configured");

  const queryHash = Array.from(query).reduce((total, character) => ((total * 31) + character.charCodeAt(0)) >>> 0, 0);
  const orderedKeys = keys.map((_, index) => keys[(queryHash + index) % keys.length]);
  const errors: string[] = [];

  for (const apiKey of orderedKeys) {
    try {
      const response = await fetch("https://api.langsearch.com/v1/web-search", {
        method: "POST",
        headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
        body: JSON.stringify({ query, freshness: "noLimit", summary: true, count: 10 }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json() as {
        code?: number;
        msg?: string;
        data?: { webPages?: { value?: Array<{ name?: string; url?: string; snippet?: string; summary?: string }> } };
      };
      if (payload.code && payload.code !== 200) throw new Error(payload.msg || `API code ${payload.code}`);
      return (payload.data?.webPages?.value || []).map((item) => ({
        title: String(item.name || ""),
        url: String(item.url || ""),
        snippet: String(item.summary || item.snippet || ""),
        provider: "langsearch",
      }));
    } catch (error) {
      errors.push(error instanceof Error ? error.message : "request failed");
    }
  }

  throw new Error(errors.join("; ") || "LangSearch request failed");
}
'''
          if tavily_block not in text:
              raise SystemExit('Expected Tavily block was not found in companyLocationDiscovery.ts')
          text = text.replace(tavily_block, langsearch_block, 1)
          old_provider = '''  const providers: Array<{ name: string; key?: string; run: (query: string, key: string) => Promise<SearchResult[]> }> = [
    { name: "serper", key: process.env.SERPER_API_KEY, run: searchSerper },
    { name: "exa", key: process.env.EXA_API_KEY, run: searchExa },
    { name: "tavily", key: process.env.TAVILY_API_KEY, run: searchTavily },
  ];
  const configured = providers.filter((provider) => provider.key);
  if (configured.length === 0) return { results: [] };
  const errors: string[] = [];
  for (const provider of configured) {
    try {
      const results = await provider.run(query, provider.key!);
      if (results.length > 0) return { results, provider: provider.name };
    } catch (error) {
      errors.push(`${provider.name}: ${error instanceof Error ? error.message : "request failed"}`);
    }
  }'''
          new_provider = '''  const providers: Array<{ name: string; configured: boolean; run: (query: string) => Promise<SearchResult[]> }> = [
    { name: "langsearch", configured: Boolean(process.env.LANGSEARCH_API_KEY || process.env.LANGSEARCH_API_KEY_2), run: searchLangSearch },
    { name: "serper", configured: Boolean(process.env.SERPER_API_KEY), run: (value) => searchSerper(value, process.env.SERPER_API_KEY!) },
    { name: "exa", configured: Boolean(process.env.EXA_API_KEY), run: (value) => searchExa(value, process.env.EXA_API_KEY!) },
    { name: "tavily", configured: Boolean(process.env.TAVILY_API_KEY), run: (value) => searchTavily(value, process.env.TAVILY_API_KEY!) },
  ];
  const configured = providers.filter((provider) => provider.configured);
  if (configured.length === 0) return { results: [] };
  const errors: string[] = [];
  for (const provider of configured) {
    try {
      const results = await provider.run(query);
      if (results.length > 0) return { results, provider: provider.name };
    } catch (error) {
      errors.push(`${provider.name}: ${error instanceof Error ? error.message : "request failed"}`);
    }
  }'''
          if old_provider not in text:
              raise SystemExit('Expected search provider block was not found in companyLocationDiscovery.ts')
          location_path.write_text(text.replace(old_provider, new_provider, 1))

          intel_path = Path('artifacts/api-server/src/routes/intelligence.ts')
          text = intel_path.read_text()
          tavily_intel = '''async function searchTavily(
  query: string,
  apiKey: string
): Promise<SearchResult[]> {
  const response = await fetch("https://api.tavily.com/search", {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${apiKey}`,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ query, max_results: 10, include_answer: false }),
  });
  if (!response.ok) throw new Error(`Tavily HTTP ${response.status}`);
  const data = await response.json() as any;
  const results: any[] = data.results ?? [];
  return results.map((r) => ({
    title: String(r.title ?? ""),
    url: String(r.url ?? ""),
    snippet: String(r.content ?? ""),
    source: "tavily",
  }));
}
'''
          langsearch_intel = tavily_intel + '''
async function searchLangSearch(query: string): Promise<SearchResult[]> {
  const keys = [process.env.LANGSEARCH_API_KEY, process.env.LANGSEARCH_API_KEY_2]
    .map((key) => key?.trim())
    .filter((key): key is string => Boolean(key));
  if (keys.length === 0) throw new Error("LangSearch is not configured");

  const queryHash = Array.from(query).reduce((total, character) => ((total * 31) + character.charCodeAt(0)) >>> 0, 0);
  const orderedKeys = keys.map((_, index) => keys[(queryHash + index) % keys.length]);
  const errors: string[] = [];

  for (const apiKey of orderedKeys) {
    try {
      const response = await fetch("https://api.langsearch.com/v1/web-search", {
        method: "POST",
        headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
        body: JSON.stringify({ query, freshness: "noLimit", summary: true, count: 10 }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json() as any;
      if (payload?.code && payload.code !== 200) throw new Error(payload.msg || `API code ${payload.code}`);
      const results: any[] = payload?.data?.webPages?.value ?? [];
      return results.map((result) => ({

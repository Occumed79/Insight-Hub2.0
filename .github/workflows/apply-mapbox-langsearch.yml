'''
          if tavily_intel not in text:
              raise SystemExit('Expected Tavily block was not found in intelligence.ts')
          text = text.replace(tavily_intel, langsearch_intel, 1)
          text = text.replace(
              '  const hasTavily = Boolean(process.env.TAVILY_API_KEY);\n  const hasFirecrawl',
              '  const hasTavily = Boolean(process.env.TAVILY_API_KEY);\n  const hasLangSearch = Boolean(process.env.LANGSEARCH_API_KEY || process.env.LANGSEARCH_API_KEY_2);\n  const hasFirecrawl',
              1,
          )
          insertion_point = '''    if (hasTavily) {
      aliasesByProvider["tavily"] ??= [];
      if (!aliasesByProvider["tavily"].includes(alias)) aliasesByProvider["tavily"].push(alias);
      for (const { q, category } of queries) {
        try {
          const results = await searchTavily(q, process.env.TAVILY_API_KEY!);
          for (const result of results) {
            allResults.push({ result, alias, query: q, category, provider: "tavily" });
          }
        } catch { /* continue */ }
      }
    }
'''
          langsearch_loop = insertion_point + '''
    if (hasLangSearch) {
      aliasesByProvider["langsearch"] ??= [];
      if (!aliasesByProvider["langsearch"].includes(alias)) aliasesByProvider["langsearch"].push(alias);
      const q = `"${alias}" OSHA injury safety Defense Base Act workers compensation occupational health locations careers`;
      try {
        const results = await searchLangSearch(q);
        for (const result of results) {
          allResults.push({ result, alias, query: q, category: "sourceFacts", provider: "langsearch" });
        }
      } catch { /* the other web providers remain available */ }
    }
'''
          if insertion_point not in text:
              raise SystemExit('Expected Tavily loop was not found in intelligence.ts')
          text = text.replace(insertion_point, langsearch_loop, 1)
          text = text.replace(
              'sourceName: provider === "serper" ? "Google (Serper)" : provider === "exa" ? "Exa" : "Tavily",',
              'sourceName: provider === "serper" ? "Google (Serper)" : provider === "exa" ? "Exa" : provider === "langsearch" ? "LangSearch" : "Tavily",',
              1,
          )
          text = text.replace(
              '    { name: "tavily", has: hasTavily, label: "Tavily (Research Search)" },\n    { name: "firecrawl"',
              '    { name: "tavily", has: hasTavily, label: "Tavily (Research Search)" },\n    { name: "langsearch", has: hasLangSearch, label: "LangSearch (Hybrid Web Search)" },\n    { name: "firecrawl"',
              1,
          )
          intel_path.write_text(text)

          render_path = Path('render.yaml')
          text = render_path.read_text()
          marker = '      - key: LANGSEARCH_API_KEY\n        sync: false\n'
          replacement = marker + '      - key: LANGSEARCH_API_KEY_2\n        sync: false\n      - key: VITE_MAPBOX_ACCESS_TOKEN\n        sync: false\n'
          if marker not in text:
              raise SystemExit('LANGSEARCH_API_KEY marker was not found in render.yaml')
          render_path.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/apply-mapbox-langsearch.yml
          git add artifacts/occu-med-insight-hub/src/pages/geographic-data.tsx artifacts/api-server/src/lib/companyLocationDiscovery.ts artifacts/api-server/src/routes/intelligence.ts render.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wire Mapbox basemap and dual-key LangSearch"
          git push origin HEAD:agent/mapbox-langsearch-integration

# trigger

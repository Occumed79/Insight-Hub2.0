name: Patch Job Intelligence Hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/job-intelligence-persistent-workspace'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Harden profile switching and structured counts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/occu-med-insight-hub/src/pages/reviewer-job-intelligence.tsx')
          text = path.read_text()

          replacements = [
              (
                  'import { BriefcaseBusiness, Check, ChevronDown, Database, Loader2, Plus, Save, Search, Trash2, X } from "lucide-react";',
                  'import { BriefcaseBusiness, Check, ChevronDown, Database, Loader2, Plus, Save, Search, Trash2 } from "lucide-react";',
              ),
              (
                  '    headers: { Accept: "application/json", ...(init.body ? { "Content-Type": "application/json" } : {}), ...(init.headers || {}) },',
                  '    headers: { Accept: "application/json", "Content-Type": "application/json" },',
              ),
              (
                  '    const structured = active.duties.filter((duty) => duty.domains.length || duty.essentiality !== "unknown" || duty.frequency !== "unknown" || duty.maxLiftLbs !== null || duty.postures.length || duty.exposures.length || duty.ppe.length || operational).length;',
                  '    const structured = active.duties.filter((duty) => duty.domains.length || duty.essentiality !== "unknown" || duty.frequency !== "unknown" || duty.maxLiftLbs !== null || duty.postures.length || duty.exposures.length || duty.ppe.length || duty.driving || duty.heights || duty.emergencyResponse || duty.shiftWork || duty.heavyEquipment || duty.firearms).length;',
              ),
              (
                  '  async function searchJob(term = query) {',
                  '  async function searchJob(term = query, attachIdentity = true) {',
              ),
              (
                  '      if (occupation?.title) {\n        mutateProfile({\n          jobTitle: active.jobTitle || occupation.title,\n          profileName: active.profileName || occupation.title,\n          onetCode: occupation.code || "",\n          onetTitle: occupation.title || "",\n          onetDescription: occupation.description || "",\n          onetMatchScore: payload.matches?.[0]?.score ?? null,\n        });\n      }',
                  '      if (attachIdentity && occupation?.title) {\n        setActive((current) => ({\n          ...current,\n          jobTitle: current.jobTitle || occupation.title || "",\n          profileName: current.profileName || occupation.title || "",\n          onetCode: occupation.code || "",\n          onetTitle: occupation.title || "",\n          onetDescription: occupation.description || "",\n          onetMatchScore: payload.matches?.[0]?.score ?? null,\n        }));\n        setDirty(true);\n      }',
              ),
              (
                  '    if (found.onetTitle || found.jobTitle) void searchJob(found.onetTitle || found.jobTitle);',
                  '    if (found.onetTitle || found.jobTitle) void searchJob(found.onetTitle || found.jobTitle, false);',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing patch target: {old[:140]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit hardening patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/occu-med-insight-hub/src/pages/reviewer-job-intelligence.tsx
          if git diff --cached --quiet; then
            echo 'Hardening patch already applied.'
            exit 0
          fi
          git commit -m 'Harden Job Intelligence profile switching'
          git push origin HEAD:${GITHUB_HEAD_REF}

name: Fix AOR Summary-Aware Browser Locators

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/aor-operational-priority'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Scope duplicate signal assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('artifacts/occu-med-insight-hub/tests/aor-consolidation.spec.ts'): {
                  'await expect(page.getByText("Level 1 · Exercise Normal Precautions")).toBeVisible();': 'await expect(page.getByText("Level 1 · Exercise Normal Precautions").first()).toBeVisible();',
                  'await expect(page.getByText("M5.1 · Kuwait test earthquake")).toBeVisible();': 'await expect(page.getByText("M5.1 · Kuwait test earthquake").first()).toBeVisible();',
                  'await expect(page.getByText("Test outbreak — Jordan")).toBeVisible();': 'await expect(page.getByText("Test outbreak — Jordan").first()).toBeVisible();',
                  'await expect(page.getByText("GREEN · Forest fires in Kazakhstan")).toBeVisible();': 'await expect(page.getByText("GREEN · Forest fires in Kazakhstan").first()).toBeVisible();',
                  'await expect(page.getByText("M4.2 · 24 km ESE of Norak, Tajikistan")).toBeVisible();': 'await expect(page.getByText("M4.2 · 24 km ESE of Norak, Tajikistan").first()).toBeVisible();',
              },
              Path('artifacts/occu-med-insight-hub/tests/occupational-intelligence.spec.ts'): {
                  'await expect(page.getByText("Test outbreak — Jordan")).toBeVisible();': 'await expect(page.getByText("Test outbreak — Jordan").first()).toBeVisible();',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text()
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'missing browser assertion in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Commit locator compatibility fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-aor-browser-locators.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Scope AOR browser assertions to summary-aware locators'
          git push origin HEAD:${GITHUB_HEAD_REF}

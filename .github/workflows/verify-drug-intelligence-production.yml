name: Verify Drug Intelligence Production

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live single-drug and regimen endpoints
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request

          BASE = 'https://insight-hub2-0-x45d.onrender.com'

          def get_json(path, params=None, timeout=40):
              url = BASE + path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'Insight-Hub2-production-verifier'})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.loads(response.read().decode('utf-8'))

          def post_json(path, payload, timeout=60):
              data = json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(BASE + path, data=data, method='POST', headers={'Accept':'application/json','Content-Type':'application/json','User-Agent':'Insight-Hub2-production-verifier'})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.loads(response.read().decode('utf-8'))

          last_error = None
          for attempt in range(1, 37):
              try:
                  print(f'Attempt {attempt}: checking live Drug Checker API')
                  gab_search = get_json('/api/reviewer-tools/rxnorm', {'term':'gabapentin'})
                  met_search = get_json('/api/reviewer-tools/rxnorm', {'term':'metoprolol'})
                  gab = (gab_search.get('candidates') or [None])[0]
                  met = (met_search.get('candidates') or [None])[0]
                  if not gab or not met:
                      raise RuntimeError('RxNorm search did not return both medications')

                  intel = get_json('/api/reviewer-tools/drug-intelligence', {'rxcui':gab['rxcui'], 'name':gab['name']})
                  assert intel.get('ok') is True
                  assert intel.get('identity', {}).get('canonicalName')
                  assert intel.get('coverage', {}).get('rxnorm') is True
                  assert isinstance(intel.get('classes'), list)
                  assert isinstance(intel.get('signals'), list)
                  assert 'limitation' in intel

                  regimen = post_json('/api/reviewer-tools/drug-regimen', {'medications':[{'rxcui':gab['rxcui'],'name':gab['name']},{'rxcui':met['rxcui'],'name':met['name']}]})
                  assert regimen.get('ok') is True
                  assert regimen.get('coverage', {}).get('selected') == 2
                  assert isinstance(regimen.get('overlaps'), list)
                  assert isinstance(regimen.get('interactionMentions'), list)
                  assert 'severity score' in regimen.get('limitation','').lower()

                  print('LIVE DRUG INTELLIGENCE VERIFIED')
                  print('Gabapentin canonical:', intel['identity']['canonicalName'])
                  print('Ingredients:', intel['identity'].get('ingredients'))
                  print('RxClass count:', len(intel.get('classes', [])))
                  print('FDA label resolved:', intel.get('coverage', {}).get('fdaLabel'))
                  print('Signal labels:', [item.get('label') for item in intel.get('signals', [])])
                  print('Regimen coverage:', regimen.get('coverage'))
                  print('Overlap categories:', [item.get('label') for item in regimen.get('overlaps', [])])
                  print('Cross-label mentions:', len(regimen.get('interactionMentions', [])))
                  raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  print('Not ready:', repr(exc))
                  time.sleep(10)
          raise SystemExit(f'Production verification failed after deployment window: {last_error!r}')
          PY

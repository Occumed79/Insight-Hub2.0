name: Verify Live OSHA OIICS Profile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/osha-oiics-aggregate-upload'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Firefighters current cases and OIICS evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          base='https://insight-hub2-0-x45d.onrender.com/api/occupational-discovery'
          query=urllib.parse.urlencode({'soc':'33-2011','title':'Firefighters'})
          url=f'{base}/osha-occupation-profile?{query}'
          payload=None
          for attempt in range(1,31):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Occu-Med Insight Hub 2.0 live verifier'})
                  with urllib.request.urlopen(req,timeout=60) as response:
                      payload=json.loads(response.read().decode('utf-8'))
                  profile=payload.get('profile') or {}
                  if profile.get('selectedYear') == 2025 and profile.get('oiicsYear') == 2024 and profile.get('bodyParts'):
                      break
                  print(f'attempt {attempt}: waiting for deployed dual-year API: {json.dumps(payload)[:1000]}', flush=True)
              except Exception as exc:
                  print(f'attempt {attempt}: {exc}', flush=True)
              time.sleep(10)
          if payload is None:
              raise RuntimeError('No live profile response received.')
          profile=payload.get('profile') or {}
          summary={
              'ok': payload.get('ok'),
              'selectedYear': profile.get('selectedYear'),
              'oiicsYear': profile.get('oiicsYear'),
              'matchedSocCode': profile.get('matchedSocCode'),
              'occupationTitle': profile.get('occupationTitle'),
              'currentReportedCases': profile.get('totalCases'),
              'daysAway': profile.get('totalDaysAway'),
              'restrictedDays': profile.get('totalRestrictedDays'),
              'oiicsCaseCount': profile.get('oiicsCaseCount'),
              'codedBodyPartCases': profile.get('codedBodyPartCases'),
              'codedNatureCases': profile.get('codedNatureCases'),
              'codedEventCases': profile.get('codedEventCases'),
              'codedSourceCases': profile.get('codedSourceCases'),
              'topBodyParts': (profile.get('bodyParts') or [])[:5],
              'topEvents': (profile.get('events') or [])[:5],
              'topNatures': (profile.get('natures') or [])[:5],
              'topSources': (profile.get('sources') or [])[:5],
          }
          print(json.dumps(summary,indent=2), flush=True)
          assert payload.get('ok') is True
          assert profile.get('selectedYear') == 2025
          assert profile.get('oiicsYear') == 2024
          assert int(profile.get('totalCases') or 0) > 0
          assert int(profile.get('codedBodyPartCases') or 0) > 0
          assert int(profile.get('codedNatureCases') or 0) > 0
          assert int(profile.get('codedEventCases') or 0) > 0
          assert int(profile.get('codedSourceCases') or 0) > 0
          assert profile.get('bodyParts')
          assert profile.get('events')
          assert profile.get('natures')
          assert profile.get('sources')
          PY

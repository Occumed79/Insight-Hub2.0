name: Extract PREVENT Equations

on:
  pull_request:
    paths:
      - '.github/workflows/extract-prevent-equations.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect PREVENT coefficient data
        run: |
          python -m pip install --quiet rdata pandas
          python - <<'PY'
          import bz2, urllib.request
          import rdata
          url = 'https://raw.githubusercontent.com/martingmayer/preventr/main/R/sysdata.rda'
          raw = urllib.request.urlopen(url, timeout=30).read()
          try:
              parsed = rdata.parser.parse_data(raw)
          except Exception:
              parsed = rdata.parser.parse_data(bz2.decompress(raw))
          obj = rdata.conversion.convert(parsed)
          print('KEYS', sorted(obj.keys()))
          for key in ['base_10yr', 'base_30yr']:
              frame = obj[key]
              print(f'BEGIN_{key}')
              print(frame.to_csv(index=False))
              print(f'END_{key}')
          PY

name: Patch Clinical Calculator PDF Report

on:
  pull_request:
    paths:
      - '.github/workflows/patch-clinical-pdf-report.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Add native PDF report export and browser validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          helper = base64.b64decode('').decode()
          download_fn = base64.b64decode('').decode()
          button = base64.b64decode('').decode()
          test_insert = base64.b64decode('').decode()

          page_path = Path('artifacts/occu-med-insight-hub/src/pages/reviewer-clinical-calculators.tsx')
          page = page_path.read_text()
          old_import = 'import { Activity, Brain, Calculator, HeartPulse, MoonStar, RefreshCw, ShieldCheck } from "lucide-react";'
          new_import = 'import { Activity, Brain, Calculator, FileDown, HeartPulse, MoonStar, RefreshCw, ShieldCheck } from "lucide-react";'
          if old_import not in page:
              raise SystemExit('Clinical calculator icon import marker not found')
          page = page.replace(old_import, new_import, 1)

          component_marker = 'export default function ReviewerClinicalCalculatorsPage() {'
          if component_marker not in page:
              raise SystemExit('Clinical calculator component marker not found')
          page = page.replace(component_marker, helper + '\n\n' + component_marker, 1)

          clear_marker = '  function clear() {'
          if clear_marker not in page:
              raise SystemExit('Clinical calculator clear marker not found')
          page = page.replace(clear_marker, download_fn + '\n' + clear_marker, 1)

          result_marker = '                    </div>\n                  </>\n                ) : ('
          if result_marker not in page:
              raise SystemExit('Clinical result footer marker not found')
          page = page.replace(result_marker, '                    </div>\n' + button + '\n                  </>\n                ) : (', 1)
          page_path.write_text(page)

          test_path = Path('artifacts/occu-med-insight-hub/tests/clinical-calculators.spec.ts')
          test = test_path.read_text()
          test_import = 'import { expect, test } from "@playwright/test";'
          if test_import not in test:
              raise SystemExit('Clinical calculator test import marker not found')
          test = test.replace(test_import, 'import { readFile } from "node:fs/promises";\n' + test_import, 1)
          output_marker = '  await expect(page.getByText("35.4%", { exact: true })).toBeVisible();\n\n'
          if output_marker not in test:
              raise SystemExit('PREVENT output test marker not found')
          test = test.replace(output_marker, output_marker + test_insert + '\n', 1)
          test_path.write_text(test)
          PY
          git rm .github/workflows/patch-clinical-pdf-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/occu-med-insight-hub/src/pages/reviewer-clinical-calculators.tsx artifacts/occu-med-insight-hub/tests/clinical-calculators.spec.ts
          git commit -m "Add PDF reports to Clinical Calculators"
          git push origin HEAD:${{ github.head_ref }}
name: Apply greener regional basemap

on:
  push:
    branches:
      - agent/greener-regional-basemap

permissions:
  contents: write

jobs:
  apply-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greener-regional-basemap
          fetch-depth: 0
      - name: Replace beige OSM regional tiles with Esri World Topographic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/occu-med-insight-hub/src/pages/geographic-data.tsx')
          text = path.read_text()
          old = '''                <TileLayer
                  attribution='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                  url="https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
                />'''
          new = '''                <TileLayer
                  attribution='Tiles &copy; <a href="https://www.esri.com/">Esri</a> — Esri, TomTom, Garmin, FAO, NOAA, USGS, OpenStreetMap contributors, and the GIS User Community'
                  url="https://services.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
                />'''
          if old not in text:
              raise SystemExit('Expected OpenStreetMap TileLayer block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/apply-greener-basemap.yml
          git add artifacts/occu-med-insight-hub/src/pages/geographic-data.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use greener topographic basemap at regional zoom"
          git push origin HEAD:agent/greener-regional-basemap

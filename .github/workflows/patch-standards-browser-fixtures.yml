name: Patch Standards Browser Fixtures

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/standards-intelligence-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Update Standards browser fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          clinical = Path('artifacts/occu-med-insight-hub/tests/clinical-calculators.spec.ts')
          text = clinical.read_text()
          old = 'await expect(page.getByText("2026-08-19", { exact: true }).first()).toBeVisible();'
          new = 'await expect(page.getByText(/2026-08-19/).first()).toBeVisible();'
          if old not in text:
              raise SystemExit('clinical date assertion not found')
          clinical.write_text(text.replace(old, new, 1))

          occupational = Path('artifacts/occu-med-insight-hub/tests/occupational-intelligence.spec.ts')
          text = occupational.read_text()
          marker = '    return fulfillJson(route, { ok: true, configured: true, records: [], datasets: [], matches: [] });\n'
          if marker not in text:
              raise SystemExit('occupational API fallback marker not found')
          insert = '''    if (path.endsWith("/api/standards/catalog")) {
      const source = {
        id: "centcom-mod18",
        shortLabel: "CENTCOM MOD 18",
        title: "USCENTCOM MOD EIGHTEEN + TAB A",
        edition: "201214Z AUG 25",
        authority: "official-policy",
        category: "Deployment",
        sourceUrl: "https://www.centcom.mil/CONTACT/THEATRE-MEDICAL-REQUIREMENTS/",
        description: "USCENTCOM deployment medical fitness standards.",
        currentAsOf: "20 Aug 2025",
        lastVerified: "2026-08-19",
        coverage: "automated-medical",
        topics: ["deployment", "fitness", "waiver"],
      };
      return fulfillJson(route, {
        ok: true,
        architectureVersion: "standards-api-v2",
        generatedAt: "2026-08-19T18:00:00.000Z",
        totalSources: 1,
        automatedSources: 1,
        categories: ["Deployment"],
        sources: [source],
      });
    }
    if (path.endsWith("/api/standards/evaluate")) {
      const body = route.request().postDataJSON() as { frameworks?: string[]; condition?: string };
      const frameworks = body.frameworks ?? [];
      const condition = (body.condition ?? "").toLowerCase();
      const source = {
        id: "centcom-mod18",
        shortLabel: "CENTCOM MOD 18",
        title: "USCENTCOM MOD EIGHTEEN + TAB A",
        edition: "201214Z AUG 25",
        authority: "official-policy",
        category: "Deployment",
        sourceUrl: "https://www.centcom.mil/CONTACT/THEATRE-MEDICAL-REQUIREMENTS/",
        description: "USCENTCOM deployment medical fitness standards.",
        currentAsOf: "20 Aug 2025",
        lastVerified: "2026-08-19",
        coverage: "automated-medical",
        topics: ["deployment", "fitness", "waiver"],
      };
      const findings = frameworks.includes("centcom-mod18") ? [
        {
          id: "mod18-functional-baseline",
          standardId: "centcom-mod18",
          level: "info",
          title: "Deployment functional baseline",
          summary: "Deployment functional baseline.",
          action: "Confirm duty-specific functional capacity.",
          citation: "MOD 18 paras 4–5",
          sourceUrl: source.sourceUrl,
          topics: ["deployment"],
          matchedBy: ["CENTCOM selected"],
        },
        ...(condition.includes("sleep apnea") || condition.includes("osa") ? [{
          id: "mod18-osa",
          standardId: "centcom-mod18",
          level: "review",
          title: "Obstructive sleep apnea deployment criteria",
          summary: "Review OSA severity and PAP compliance.",
          action: "Review diagnostic AHI and PAP compliance.",
          citation: "MOD 18 Tab A §7.A.15",
          sourceUrl: source.sourceUrl,
          topics: ["OSA"],
          matchedBy: ["condition"],
        }] : []),
      ] : [];
      findings.sort((a, b) => ({ info: 0, review: 1, waiver: 2, strict: 3 }[b.level as "info" | "review" | "waiver" | "strict"] - { info: 0, review: 1, waiver: 2, strict: 3 }[a.level as "info" | "review" | "waiver" | "strict"]));
      return fulfillJson(route, {
        ok: true,
        architectureVersion: "standards-api-v2",
        evaluatedAt: "2026-08-19T18:00:00.000Z",
        selectedSources: frameworks.includes("centcom-mod18") ? [source] : [],
        findings,
        recommendations: [],
        coverage: { selected: frameworks.length, matched: findings.length ? 1 : 0, automatedSelected: frameworks.length, referenceSelected: 0 },
      });
    }

'''
          occupational.write_text(text.replace(marker, insert + marker, 1))
          PY
          git rm .github/workflows/patch-standards-browser-fixtures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/occu-med-insight-hub/tests/clinical-calculators.spec.ts artifacts/occu-med-insight-hub/tests/occupational-intelligence.spec.ts
          git commit -m "Align browser fixtures with Standards API architecture"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: OSHA Live Trigger Once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  trigger:
    if: github.head_ref == 'ops/fire-osha-trigger-now'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Trigger and wait for live OSHA import completion
        shell: bash
        run: |
          set -euo pipefail
          url='https://insight-hub2-0-x45d.onrender.com/api/occupational-discovery/osha-case-import-once'
          for i in $(seq 1 150); do
            code=$(curl -sS -o /tmp/osha-trigger.json -w '%{http_code}' --max-time 30 "$url" || true)
            body=$(cat /tmp/osha-trigger.json 2>/dev/null || true)
            echo "attempt=$i status=$code body=$body"
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"reason":"already-imported"'; then
              echo 'OSHA case-detail import is complete.'
              exit 0
            fi
            if printf '%s' "$body" | grep -Eq '"lastImportExit":\{"code":[1-9]|"lastImportExit":\{"code":null'; then
              echo 'OSHA import process exited unsuccessfully.' >&2
              exit 1
            fi
            sleep 15
          done
          echo 'Timed out waiting for OSHA case-detail import completion.' >&2
          exit 1

name: Debug Org Chart Typecheck

on:
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Typecheck with compact logs
        run: |
          corepack enable
          pnpm install --frozen-lockfile --silent >/dev/null 2>&1
          pnpm typecheck

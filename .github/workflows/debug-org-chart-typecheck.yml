name: Debug Org Chart Typecheck

on:
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --silent >/dev/null 2>&1
      - name: Capture typecheck output
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck > typecheck-errors.txt 2>&1
      - name: Upload typecheck output
        uses: actions/upload-artifact@v4
        with:
          name: org-chart-typecheck-errors
          path: typecheck-errors.txt
          if-no-files-found: error
      - name: Fail when typecheck failed
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

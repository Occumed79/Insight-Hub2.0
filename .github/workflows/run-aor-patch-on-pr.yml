name: Run AOR Patch On PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/aor-operational-priority'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute embedded AOR patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/patch-aor-operational-priority.yml').read_text()
          marker = "          python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('embedded patch marker not found')
          body = workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          exec(compile(script, 'embedded-aor-patch.py', 'exec'), {})
          PY

      - name: Commit actual AOR changes and remove runners
        shell: bash
        run: |
          rm -f .github/workflows/patch-aor-operational-priority.yml .github/workflows/run-aor-patch-on-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prioritize AOR operational intelligence'
          git push origin HEAD:${GITHUB_HEAD_REF}

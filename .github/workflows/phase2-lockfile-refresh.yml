name: Phase 2 Lockfile Refresh

on:
  push:
    branches:
      - agent/phase-2-proven-garbage-removal

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-proven-garbage-removal
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Regenerate workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit refreshed lockfile and remove one-time workflow
        run: |
          rm .github/workflows/phase2-lockfile-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/phase2-lockfile-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh lockfile after Phase 2 cleanup [skip ci]"
          git push origin HEAD:agent/phase-2-proven-garbage-removal

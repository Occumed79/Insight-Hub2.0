name: Patch Job Intelligence Null Numerics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/job-intelligence-persistent-workspace'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Preserve unknown numeric fields as null
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/services/jobIntelligenceService.ts')
          text = path.read_text()
          old = '''function numberOrNull(value: unknown): number | null {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : null;
          }'''
          new = '''function numberOrNull(value: unknown): number | null {
            if (value === null || value === undefined || value === "") return null;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : null;
          }'''
          if old not in text:
              raise SystemExit('numberOrNull target not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit normalization fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/services/jobIntelligenceService.ts
          if git diff --cached --quiet; then
            echo 'Numeric normalization already fixed.'
            exit 0
          fi
          git commit -m 'Preserve unknown Job Intelligence numeric fields'
          git push origin HEAD:${GITHUB_HEAD_REF}

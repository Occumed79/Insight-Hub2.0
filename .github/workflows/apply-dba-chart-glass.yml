name: Apply DBA chart glass fixes

on:
  push:
    branches:
      - agent/dba-chart-glass-tooltips

permissions:
  contents: write

jobs:
  apply-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dba-chart-glass-tooltips
          fetch-depth: 0

      - name: Apply chart card and tooltip repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('artifacts/occu-med-insight-hub/src/pages/dba-intelligence.tsx'),
              Path('artifacts/occu-med-insight-hub/src/components/insight/DbaCumulativeWorkspace.tsx'),
          ]

          glass_tooltip = 'contentStyle={{ background: "rgba(5, 18, 38, .88)", border: "1px solid rgba(165,243,252,.30)", borderRadius: 16, color: "#ecfeff", boxShadow: "0 18px 52px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 24px rgba(34,211,238,.08)", backdropFilter: "blur(18px) saturate(1.35)", WebkitBackdropFilter: "blur(18px) saturate(1.35)" }} itemStyle={{ color: "#ecfeff", fontWeight: 700 }} labelStyle={{ color: "rgba(207,250,254,.72)", fontWeight: 700, marginBottom: 4 }} wrapperStyle={{ outline: "none", zIndex: 40 }}'
          old_style = 'contentStyle={{ background: "#050b16", border: "1px solid rgba(165,243,252,.18)", borderRadius: 16, color: "white" }}'

          for path in paths:
              text = path.read_text()
              text = text.replace('<GlassCard ', '<GlassCard variant="glass" ')
              text = text.replace(old_style, glass_tooltip)

              # Donut values are already visible in the surrounding legend. Removing the floating
              # tooltip eliminates the opaque black hover rectangle and prevents edge clipping.
              text = text.replace(
                  '                <Tooltip formatter={(value) => Number(value).toLocaleString()} ' + glass_tooltip + ' />\n',
                  '',
              )
              text = text.replace(
                  '              <Tooltip formatter={(value) => Number(value).toLocaleString()} ' + glass_tooltip + ' />\n',
                  '',
              )

              # Give each chart an inner translucent plotting surface in addition to the outer card.
              text = text.replace(
                  'className="mt-5 h-[285px]"',
                  'className="mt-5 h-[285px] rounded-[22px] border border-cyan-100/10 bg-slate-950/20 p-3 shadow-[inset_0_1px_0_rgba(255,255,255,.05),inset_0_0_34px_rgba(34,211,238,.04)]"',
              )
              text = text.replace(
                  'className="mt-5 h-[420px]"',
                  'className="mt-5 h-[420px] rounded-[22px] border border-cyan-100/10 bg-slate-950/20 p-3 shadow-[inset_0_1px_0_rgba(255,255,255,.05),inset_0_0_34px_rgba(34,211,238,.04)]"',
              )
              text = text.replace(
                  'className="mt-5 h-[455px]"',
                  'className="mt-5 h-[455px] rounded-[22px] border border-cyan-100/10 bg-slate-950/20 p-3 shadow-[inset_0_1px_0_rgba(255,255,255,.05),inset_0_0_34px_rgba(34,211,238,.04)]"',
              )
              text = text.replace(
                  'className="relative mt-4 h-[270px]"',
                  'className="relative mt-4 h-[270px] rounded-[22px] border border-cyan-100/10 bg-slate-950/20 p-2 shadow-[inset_0_1px_0_rgba(255,255,255,.05),inset_0_0_34px_rgba(167,139,250,.05)]"',
              )
              text = text.replace(
                  'className="relative h-[230px]"',
                  'className="relative h-[230px] rounded-[22px] border border-cyan-100/10 bg-slate-950/20 p-2 shadow-[inset_0_1px_0_rgba(255,255,255,.05),inset_0_0_34px_rgba(167,139,250,.05)]"',
              )

              path.write_text(text)

          workflow = Path('.github/workflows/apply-dba-chart-glass.yml')
          workflow.unlink()
          PY

      - name: Commit repaired DBA visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Give DBA charts translucent cards and glass tooltips"
          git push origin HEAD:agent/dba-chart-glass-tooltips

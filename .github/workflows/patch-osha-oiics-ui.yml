name: Patch OSHA OIICS UI Labels

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/osha-oiics-ui-labels'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch dual-year OSHA/OIICS labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          injuries_path = Path('artifacts/occu-med-insight-hub/src/pages/reviewer-injuries-medical.tsx')
          hologram_path = Path('artifacts/occu-med-insight-hub/src/pages/reviewer-injury-hologram.tsx')

          injuries = injuries_path.read_text()
          replacements = [
              (
                  '  selectedYear: number | null;\n  totalCases: number;',
                  '  selectedYear: number | null;\n  oiicsYear: number | null;\n  totalCases: number;',
              ),
              (
                  '<Metric label="Body-part coded" value={`${caseProfile.codedBodyPartCases.toLocaleString()} / ${caseProfile.totalCases.toLocaleString()}`} note="Cases with OSHA/BLS OIICS body-part classification" />',
                  '<Metric label="Body-part coded (OIICS)" value={caseProfile.codedBodyPartCases.toLocaleString()} note={`CY${caseProfile.oiicsYear ?? "—"} OIICS-coded historical cases · separate from CY${caseProfile.selectedYear ?? "—"} current case totals`} />',
              ),
              (
                  '<Distribution title="Body parts affected" items={caseProfile.bodyParts} denominatorLabel={`${caseProfile.codedBodyPartCases.toLocaleString()} body-part-coded cases`} />',
                  '<Distribution title={`Body parts affected · OIICS CY${caseProfile.oiicsYear ?? "—"}`} items={caseProfile.bodyParts} denominatorLabel={`CY${caseProfile.oiicsYear ?? "—"} · ${caseProfile.codedBodyPartCases.toLocaleString()} body-part-coded cases`} />',
              ),
              (
                  '<Distribution title="Events / exposures" items={caseProfile.events} denominatorLabel={`${caseProfile.codedEventCases.toLocaleString()} event-coded cases`} />',
                  '<Distribution title={`Events / exposures · OIICS CY${caseProfile.oiicsYear ?? "—"}`} items={caseProfile.events} denominatorLabel={`CY${caseProfile.oiicsYear ?? "—"} · ${caseProfile.codedEventCases.toLocaleString()} event-coded cases`} />',
              ),
              (
                  '<Distribution title="Nature of injury / illness" items={caseProfile.natures} denominatorLabel={`${caseProfile.codedNatureCases.toLocaleString()} nature-coded cases`} />',
                  '<Distribution title={`Nature of injury / illness · OIICS CY${caseProfile.oiicsYear ?? "—"}`} items={caseProfile.natures} denominatorLabel={`CY${caseProfile.oiicsYear ?? "—"} · ${caseProfile.codedNatureCases.toLocaleString()} nature-coded cases`} />',
              ),
              (
                  '<Distribution title="Primary source" items={caseProfile.sources} denominatorLabel={`${caseProfile.codedSourceCases.toLocaleString()} source-coded cases`} />',
                  '<Distribution title={`Primary source · OIICS CY${caseProfile.oiicsYear ?? "—"}`} items={caseProfile.sources} denominatorLabel={`CY${caseProfile.oiicsYear ?? "—"} · ${caseProfile.codedSourceCases.toLocaleString()} source-coded cases`} />',
              ),
              (
                  'OSHA case-detail percentages describe the distribution of coded cases in the matched imported records, not the probability that a worker will be injured.',
                  'OSHA OIICS percentages describe the distribution of coded cases from the OIICS evidence year shown on each panel, not the probability that a worker will be injured. Current case totals may use a newer reporting year than the coded OIICS distributions.',
              ),
          ]
          for old, new in replacements:
              if old not in injuries:
                  raise SystemExit(f'Missing injuries replacement target: {old[:120]}')
              injuries = injuries.replace(old, new, 1)
          injuries_path.write_text(injuries)

          hologram = hologram_path.read_text()
          hologram_replacements = [
              (
                  '  selectedYear?: number | null;\n  totalCases?: number;',
                  '  selectedYear?: number | null;\n  oiicsYear?: number | null;\n  totalCases?: number;',
              ),
              (
                  'mode === "osha" ? `Reported case anatomy · ${caseProfile?.selectedYear ?? "latest imported year"}` : "Job-demand anatomical attention map"',
                  'mode === "osha" ? `Reported case anatomy · OIICS CY${caseProfile?.oiicsYear ?? "—"}` : "Job-demand anatomical attention map"',
              ),
              (
                  'mode === "osha" ? "OSHA OIICS BODY-PART DATA" : "O*NET JOB-DEMAND SIGNAL"',
                  'mode === "osha" ? `OSHA OIICS BODY-PART DATA · CY${caseProfile?.oiicsYear ?? "—"}` : "O*NET JOB-DEMAND SIGNAL"',
              ),
          ]
          for old, new in hologram_replacements:
              if old not in hologram:
                  raise SystemExit(f'Missing hologram replacement target: {old[:120]}')
              hologram = hologram.replace(old, new, 1)
          hologram_path.write_text(hologram)
          PY

      - name: Commit UI patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/occu-med-insight-hub/src/pages/reviewer-injuries-medical.tsx artifacts/occu-med-insight-hub/src/pages/reviewer-injury-hologram.tsx
          if git diff --cached --quiet; then
            echo 'UI patch already applied.'
            exit 0
          fi
          git commit -m 'Label current OSHA cases separately from OIICS evidence year'
          git push origin HEAD:${GITHUB_HEAD_REF}

name: Patch Job Intelligence Audit Baseline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/job-intelligence-persistent-workspace'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Review repository file ceiling for Job Intelligence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('docs/repository-cleanup-baseline.json')
          data = json.loads(path.read_text())
          current = data.get('maximums', {}).get('totalFiles')
          if current != 267:
              raise SystemExit(f'Expected reviewed totalFiles ceiling 267, got {current}')
          data['maximums']['totalFiles'] = 270
          description = data.get('description', '')
          addition = ' Job Intelligence now deliberately adds one Neon persistence service, one dedicated profile API route, and one browser acceptance test to replace the former global localStorage duty bucket with durable company/job profiles; the reviewed repository file ceiling is therefore 270 while all duplicate, generated-artifact, reachability, shell, CSS, coordinate, and architecture-candidate ceilings remain unchanged.'
          if addition.strip() not in description:
              data['description'] = description + addition
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit reviewed baseline
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repository-cleanup-baseline.json
          if git diff --cached --quiet; then
            echo 'Baseline already reviewed.'
            exit 0
          fi
          git commit -m 'Review repository ceiling for Job Intelligence persistence'
          git push origin HEAD:${GITHUB_HEAD_REF}

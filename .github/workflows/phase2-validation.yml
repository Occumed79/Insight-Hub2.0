name: Phase 2 Validation

on:
  push:
    branches:
      - agent/phase-2-proven-garbage-removal

permissions:
  contents: write

jobs:
  validate-cleanup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
      BASE_PATH: /
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-proven-garbage-removal
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Repository integrity audit
        run: pnpm run audit:repository

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build

      - name: Remove successful one-time validation workflow
        run: |
          rm .github/workflows/phase2-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase2-validation.yml
          git commit -m "Validate Phase 2 repository cleanup"
          git push origin HEAD:agent/phase-2-proven-garbage-removal

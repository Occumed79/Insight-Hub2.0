name: Cinematic Visual Expansion Finalizer

on:
  push:
    branches:
      - agent/cinematic-apple-visual-expansion

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/cinematic-apple-visual-expansion

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply cinematic visual expansion
        run: |
          python <<'PY'
          from pathlib import Path

          page_path = Path('artifacts/occu-med-insight-hub/src/pages/data-visualization.tsx')
          text = page_path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'Missing transformation anchor: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { useMemo, useState, type ReactNode } from "react";',
              'import { useEffect, useMemo, useRef, useState, type CSSProperties, type ReactNode } from "react";',
              'react imports',
          )
          replace_once(
              'import { motion } from "framer-motion";',
              'import { motion, useScroll, useSpring, useTransform } from "framer-motion";',
              'framer imports',
          )

          anchor = 'const PALETTE = ["#22d3ee", "#a78bfa", "#34d399", "#fbbf24", "#f472b6", "#fb7185", "#60a5fa", "#a3e635"];\n'
          addition = r'''

const CINEMATIC_SCENES = [
  { id: "scene-contracts", label: "Contracts" },
  { id: "scene-workforce", label: "Workforce" },
  { id: "scene-location", label: "Geography" },
  { id: "scene-matrix", label: "Matrix" },
  { id: "scene-evidence", label: "Evidence" },
  { id: "scene-confidence", label: "Confidence" },
];

function EvidenceAperture({
  companyName,
  verified,
  searchDerived,
  sourceLeads,
  staticSources,
}: {
  companyName: string;
  verified: number;
  searchDerived: number;
  sourceLeads: number;
  staticSources: number;
}) {
  const total = Math.max(verified + searchDerived + sourceLeads + staticSources, 1);
  const verifiedStop = (verified / total) * 100;
  const searchStop = verifiedStop + (searchDerived / total) * 100;
  const leadStop = searchStop + (sourceLeads / total) * 100;
  const spectrum = `conic-gradient(from -32deg, #34d399 0 ${verifiedStop}%, #a78bfa ${verifiedStop}% ${searchStop}%, #fbbf24 ${searchStop}% ${leadStop}%, rgba(148,163,184,.72) ${leadStop}% 100%)`;

  return (
    <div className="cinematic-evidence-aperture" style={{ "--evidence-spectrum": spectrum } as CSSProperties}>
      <div className="cinematic-aperture-rim" />
      <div className="cinematic-aperture-core">
        <span>Evidence composition</span>
        <b>{companyName}</b>
        <small>{total === 1 && verified + searchDerived + sourceLeads + staticSources === 0 ? "No evidence loaded" : `${verified + searchDerived + sourceLeads} live/source records · ${staticSources} static sources`}</small>
      </div>
      <div className="cinematic-aperture-legend">
        <span><i className="verified" />Verified {verified}</span>
        <span><i className="search" />Search-derived {searchDerived}</span>
        <span><i className="lead" />Leads {sourceLeads}</span>
        <span><i className="static" />Static {staticSources}</span>
      </div>
    </div>
  );
}

function CinematicSceneRail({ activeScene }: { activeScene: string }) {
  return (
    <nav className="cinematic-scene-rail" aria-label="Visualization story scenes">
      {CINEMATIC_SCENES.map((scene, index) => (
        <button
          key={scene.id}
          type="button"
          className={activeScene === scene.id ? "active" : ""}
          onClick={() => document.getElementById(scene.id)?.scrollIntoView({ behavior: "smooth", block: "start" })}
          aria-label={`Go to ${scene.label}`}
        >
          <span>{String(index + 1).padStart(2, "0")}</span>
          <b>{scene.label}</b>
        </button>
      ))}
    </nav>
  );
}
'''
          replace_once(anchor, anchor + addition, 'cinematic components')

          old_scene = r'''function SceneSection({ eyebrow, title, subtitle, children, alt = false }: { eyebrow: string; title: string; subtitle: string; children: ReactNode; alt?: boolean }) {
  return (
    <section className={`cinematic-scene-section ${alt ? "cinematic-scene-alt" : ""}`}>
      <div className="cinematic-scene-sticky relaxed">
        <motion.div initial={{ opacity: 0, y: 38 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true, margin: "-100px" }} transition={{ duration: 0.7, ease: [0.22, 1, 0.36, 1] }}>
          <p className="cinematic-scene-eyebrow">{eyebrow}</p>
          <h2 className="cinematic-scene-title">{title}</h2>
          <p className="cinematic-scene-subtitle">{subtitle}</p>
        </motion.div>
        {children}
      </div>
    </section>
  );
}'''
          new_scene = r'''function SceneSection({ id, eyebrow, title, subtitle, children, alt = false }: { id: string; eyebrow: string; title: string; subtitle: string; children: ReactNode; alt?: boolean }) {
  return (
    <section id={id} data-cinematic-scene className={`cinematic-scene-section ${alt ? "cinematic-scene-alt" : ""}`}>
      <div className="cinematic-scene-shell">
        <motion.div className="cinematic-scene-copy" initial={{ opacity: 0, y: 44 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true, margin: "-120px" }} transition={{ duration: 0.78, ease: [0.22, 1, 0.36, 1] }}>
          <p className="cinematic-scene-eyebrow">{eyebrow}</p>
          <h2 className="cinematic-scene-title">{title}</h2>
          <p className="cinematic-scene-subtitle">{subtitle}</p>
          <span className="cinematic-scene-index">{eyebrow.replace("Scene ", "")}</span>
        </motion.div>
        <motion.div className="cinematic-scene-content" initial={{ opacity: 0, y: 56, scale: 0.985 }} whileInView={{ opacity: 1, y: 0, scale: 1 }} viewport={{ once: true, margin: "-90px" }} transition={{ duration: 0.85, ease: [0.22, 1, 0.36, 1] }}>
          {children}
        </motion.div>
      </div>
    </section>
  );
}'''
          replace_once(old_scene, new_scene, 'scene section')

          replace_once(
              'export default function DataVisualization() {\n  const { dataset } = useInsightData();',
              'export default function DataVisualization() {\n  const pageRef = useRef<HTMLElement>(null);\n  const { scrollYProgress } = useScroll({ target: pageRef, offset: ["start start", "end end"] });\n  const scrollProgress = useSpring(scrollYProgress, { stiffness: 120, damping: 28, mass: 0.3 });\n  const heroY = useTransform(scrollYProgress, [0, 0.16], [0, 120]);\n  const heroOpacity = useTransform(scrollYProgress, [0, 0.14], [1, 0.2]);\n  const { dataset } = useInsightData();',
              'page scroll hooks',
          )

          replace_once(
              '  const [localIntelligence, setLocalIntelligence] = useState<CompanyIntelligence | undefined>(undefined);\n',
              '  const [localIntelligence, setLocalIntelligence] = useState<CompanyIntelligence | undefined>(undefined);\n  const [activeScene, setActiveScene] = useState(CINEMATIC_SCENES[0].id);\n\n  useEffect(() => {\n    const sections = CINEMATIC_SCENES.map((scene) => document.getElementById(scene.id)).filter(Boolean) as HTMLElement[];\n    const observer = new IntersectionObserver((entries) => {\n      const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];\n      if (visible?.target.id) setActiveScene(visible.target.id);\n    }, { rootMargin: "-32% 0px -48% 0px", threshold: [0.12, 0.35, 0.6] });\n    sections.forEach((section) => observer.observe(section));\n    return () => observer.disconnect();\n  }, []);\n',
              'scene observer',
          )

          replace_once(
              '    <main className="aurora-bg cinematic-page min-h-screen text-white">\n      <Sidebar />',
              '    <main ref={pageRef} className="aurora-bg cinematic-page min-h-screen text-white">\n      <motion.div className="cinematic-scroll-progress" style={{ scaleX: scrollProgress }} />\n      <CinematicSceneRail activeScene={activeScene} />\n      <Sidebar />',
              'main progress and rail',
          )

          old_hero = r'''        <section className="cinematic-hero-section">
          <motion.div className="cinematic-hero-content" initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8, ease: [0.22, 1, 0.36, 1] }}>
            <p className="cinematic-hero-eyebrow">Source-aware visualization engine</p>
            <h1 className="cinematic-hero-title">Cinematic intelligence without fake charts.</h1>
            <p className="cinematic-hero-subtitle">
              {company?.name ?? resolvedCompanyId} is shown through validated charts, proof objects, source ledgers, and data-quality guardrails. Single-value bars, unknown-region bars, and fake trends are suppressed.
            </p>
            <div className="cinematic-hero-metrics">
              {[
                [liveFacts.length, "live facts"],
                [verifiedFacts.length, "verified"],
                [searchDerivedFacts.length, "search-derived"],
                [sourceLeads.length, "source leads"],
                [sources.length, "static sources"],
                [invalidCharts.length, "chart guardrails"],
              ].map(([value, label]) => (
                <div key={label as string} className="cinematic-hero-metric"><span className="cinematic-hero-metric-value">{value}</span><span className="cinematic-hero-metric-label">{label}</span></div>
              ))}
            </div>
            <div className="cinematic-evidence-statement">
              Live ingestion found {liveFacts.length} source-backed facts from {providerCount} provider/source type{providerCount === 1 ? "" : "s"}. {sourceLeads.length} item{sourceLeads.length === 1 ? "" : "s"} require manual review. {verifiedFacts.length === 0 && searchDerivedFacts.length > 0 ? "Data is source-led, not fully verified." : "Verified records are separated from search-derived evidence."}
            </div>
          </motion.div>
        </section>'''
          new_hero = r'''        <section className="cinematic-hero-section">
          <motion.div className="cinematic-hero-content" style={{ y: heroY, opacity: heroOpacity }} initial={{ opacity: 0, y: 34 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.9, ease: [0.22, 1, 0.36, 1] }}>
            <div className="cinematic-hero-copy">
              <p className="cinematic-hero-eyebrow">Source-aware visualization engine</p>
              <h1 className="cinematic-hero-title">Intelligence that changes shape with the evidence.</h1>
              <p className="cinematic-hero-subtitle">
                {company?.name ?? resolvedCompanyId} is revealed through validated charts, proof objects, spatial matrices, source ledgers, and explicit data-quality guardrails. The visual system expands only when the evidence earns it.
              </p>
              <div className="cinematic-hero-metrics">
                {[
                  [liveFacts.length, "live facts"],
                  [verifiedFacts.length, "verified"],
                  [searchDerivedFacts.length, "search-derived"],
                  [sourceLeads.length, "source leads"],
                  [sources.length, "static sources"],
                  [invalidCharts.length, "guardrails"],
                ].map(([value, label]) => (
                  <div key={label as string} className="cinematic-hero-metric"><span className="cinematic-hero-metric-value">{value}</span><span className="cinematic-hero-metric-label">{label}</span></div>
                ))}
              </div>
              <div className="cinematic-evidence-statement">
                {liveFacts.length} source-backed facts are distributed across {providerCount} provider/source type{providerCount === 1 ? "" : "s"}. {sourceLeads.length} item{sourceLeads.length === 1 ? "" : "s"} require manual review. {verifiedFacts.length === 0 && searchDerivedFacts.length > 0 ? "This profile is source-led, not fully verified." : "Verified records remain visually separate from search-derived evidence."}
              </div>
            </div>
            <EvidenceAperture companyName={company?.shortName ?? company?.name ?? resolvedCompanyId} verified={verifiedFacts.length} searchDerived={searchDerivedFacts.length} sourceLeads={sourceLeads.length} staticSources={sources.length} />
          </motion.div>
        </section>'''
          replace_once(old_hero, new_hero, 'hero aperture')

          replacements = {
              '<SceneSection eyebrow="Scene 01"': '<SceneSection id="scene-contracts" eyebrow="Scene 01"',
              '<SceneSection eyebrow="Scene 02"': '<SceneSection id="scene-workforce" eyebrow="Scene 02"',
              '<SceneSection eyebrow="Scene 03"': '<SceneSection id="scene-location" eyebrow="Scene 03"',
              '<SceneSection eyebrow="Scene 04"': '<SceneSection id="scene-matrix" eyebrow="Scene 04"',
              '<SceneSection eyebrow="Scene 05"': '<SceneSection id="scene-evidence" eyebrow="Scene 05"',
              '<SceneSection eyebrow="Scene 06"': '<SceneSection id="scene-confidence" eyebrow="Scene 06"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing scene anchor: {old}')
              text = text.replace(old, new, 1)

          page_path.write_text(text)

          css_path = Path('artifacts/occu-med-insight-hub/src/styles/application.css')
          css = css_path.read_text()
          marker = '/* Phase 6 cinematic Apple visual expansion */'
          if marker in css:
              raise SystemExit('Cinematic CSS marker already exists')
          css += r'''


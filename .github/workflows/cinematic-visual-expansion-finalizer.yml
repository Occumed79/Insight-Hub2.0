      - name: Remove temporary finalizer before validation
        run: git rm .github/workflows/cinematic-visual-expansion-finalizer.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository integrity audit
        run: pnpm audit:repo:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Commit validated expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/occu-med-insight-hub/src/pages/data-visualization.tsx artifacts/occu-med-insight-hub/src/styles/application.css
          git commit -m "Expand the cinematic Apple visual system"
          git push origin HEAD:agent/cinematic-apple-visual-expansion

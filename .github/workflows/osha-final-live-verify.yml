name: OSHA Final Live Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/osha-final-live-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify final production OSHA data layer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.error, urllib.parse, urllib.request

          BASE='https://insight-hub2-0-x45d.onrender.com/api/occupational-discovery'
          HEADERS={'User-Agent':'Occu-Med Insight Hub 2.0 final verifier'}

          def request(method, path, data=None, headers=None, timeout=60):
              req=urllib.request.Request(BASE+path,data=data,headers=headers or HEADERS,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as response:
                      return response.status, response.read().decode('utf-8','replace')
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode('utf-8','replace')

          def parsed_json(body):
              try: return json.loads(body)
              except Exception: return None

          profile_payload=None
          for attempt in range(1,61):
              q=urllib.parse.urlencode({'soc':'33-2011','title':'Firefighters'})
              status, body=request('GET',f'/osha-occupation-profile?{q}')
              candidate=parsed_json(body)
              p=(candidate or {}).get('profile') or {}
              if (status == 200 and (candidate or {}).get('ok') is True
                  and p.get('selectedYear') == 2025 and p.get('oiicsYear') == 2024
                  and int(p.get('totalCases') or 0) > 0
                  and int(p.get('totalRestrictedDays') or 0) >= 0
                  and int(p.get('codedBodyPartCases') or 0) > 0
                  and p.get('bodyParts') and p.get('events') and p.get('natures') and p.get('sources')):
                  profile_payload=candidate
                  break
              print(f'attempt {attempt}: selected={p.get("selectedYear")} oiics={p.get("oiicsYear")} restricted={p.get("totalRestrictedDays")}',flush=True)
              time.sleep(10)
          if not profile_payload:
              raise RuntimeError('Final production OSHA profile did not become healthy in time.')

          p=profile_payload['profile']
          _, overview_body=request('GET','/osha-case-overview')
          overview=parsed_json(overview_body) or {}
          total_imported=int((overview.get('importInfo') or {}).get('totalCases') or 0)

          batch_status,batch_body=request(
              'POST','/osha-oiics-profile/batch',
              data=b'{"rows":[]}',
              headers={**HEADERS,'Content-Type':'application/json'},
          )
          batch_json=parsed_json(batch_body)
          batch_route_present=bool(
              isinstance(batch_json,dict) and (
                  'accepted' in batch_json or
                  'Provide 1-100 OIICS occupation profile rows.' in str(batch_json.get('error',''))
              )
          )

          status_http,status_body=request('GET','/osha-oiics-profile/status')
          status_json=parsed_json(status_body)
          status_route_present=bool(isinstance(status_json,dict) and 'profiles' in status_json)

          summary={
              'currentImportedCases': total_imported,
              'firefighter': {
                  'selectedYear': p.get('selectedYear'),
                  'oiicsYear': p.get('oiicsYear'),
                  'matchedSocCode': p.get('matchedSocCode'),
                  'currentReportedCases': p.get('totalCases'),
                  'daysAway': p.get('totalDaysAway'),
                  'restrictedDays': p.get('totalRestrictedDays'),
                  'oiicsCaseCount': p.get('oiicsCaseCount'),
                  'codedBodyPartCases': p.get('codedBodyPartCases'),
                  'codedNatureCases': p.get('codedNatureCases'),
                  'codedEventCases': p.get('codedEventCases'),
                  'codedSourceCases': p.get('codedSourceCases'),
                  'topBodyPart': (p.get('bodyParts') or [None])[0],
                  'topEvent': (p.get('events') or [None])[0],
                  'topNature': (p.get('natures') or [None])[0],
                  'topSource': (p.get('sources') or [None])[0],
              },
              'temporaryEndpoints': {
                  'batchHttp': batch_status,
                  'batchRoutePresent': batch_route_present,
                  'statusHttp': status_http,
                  'statusRoutePresent': status_route_present,
              },
          }
          print(json.dumps(summary,indent=2),flush=True)

          assert total_imported == 697201
          assert p.get('selectedYear') == 2025
          assert p.get('oiicsYear') == 2024
          assert int(p.get('totalRestrictedDays') or 0) >= 0
          assert int(p.get('codedBodyPartCases') or 0) > 0
          assert int(p.get('codedNatureCases') or 0) > 0
          assert int(p.get('codedEventCases') or 0) > 0
          assert int(p.get('codedSourceCases') or 0) > 0
          assert batch_route_present is False
          assert status_route_present is False
          PY

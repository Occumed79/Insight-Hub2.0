name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
      BASE_PATH: /
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Repository integrity audit
        run: pnpm run audit:repository

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: pnpm run typecheck > typecheck.log 2>&1

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-typecheck-diagnostics
          path: typecheck.log

      - name: Fail after typecheck diagnostics
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Build
        run: pnpm run build

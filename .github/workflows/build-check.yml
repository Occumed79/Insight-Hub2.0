name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  typecheck-build-and-browser:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
      BASE_PATH: /
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Regenerate stale lockfile on this hardening branch
        if: github.event_name == 'pull_request' && github.head_ref == 'hardening/post-127-browser-ci-cleanup'
        shell: bash
        run: |
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
          pnpm install --lockfile-only --no-frozen-lockfile
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Sync pnpm lockfile with workspace manifests"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
            echo "Lockfile synchronized on PR head; ending this run so the new head can validate."
            exit 1
          fi

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Repository integrity audit
        run: pnpm run audit:repository

      - name: Unit tests
        run: pnpm run test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/occu-med-insight-hub exec playwright install --with-deps chromium

      - name: Browser acceptance — Hub 2 UI hardening
        run: pnpm run test:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hub2-playwright-failure
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/occu-med-insight-hub/playwright-report
            artifacts/occu-med-insight-hub/test-results

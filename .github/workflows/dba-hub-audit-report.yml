name: DBA Hub audit report

on:
  push:
    branches:
      - agent/dba-data-hub

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dba-data-hub
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate audit report
        run: node scripts/repository-audit.mjs --json > docs/dba-hub-audit-report.json
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dba-hub-audit-report.json
          git commit -m "Capture DBA hub audit diagnostics"
          git push origin HEAD:agent/dba-data-hub

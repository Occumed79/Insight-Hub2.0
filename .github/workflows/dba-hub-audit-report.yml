name: DBA Hub audit report

on:
  push:
    branches:
      - agent/dba-data-hub

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate audit report
        run: node scripts/repository-audit.mjs --json > audit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: dba-hub-audit-report
          path: audit-report.json

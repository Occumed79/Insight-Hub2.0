name: Run organizational-chart contact patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/contact-links-trigger.txt
      - .github/workflows/apply-org-chart-contact-links.yml
      - .github/scripts/apply_org_contact_patch.py

permissions:
  contents: write

jobs:
  apply-contact-feature:
    if: github.head_ref == 'agent/org-chart-contact-links'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-chart-contact-links
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply organizational-chart contact feature
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import traceback

          try:
              subprocess.run(["python", ".github/scripts/apply_org_contact_patch.py"], check=True)
          except BaseException:
              Path('.github/contact-patch-error.txt').write_text(traceback.format_exc())
              raise
          PY

      - name: Validate application
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run audit:repository
          pnpm run build

      - name: Commit the feature to its branch
        run: |
          rm -f .github/workflows/apply-org-chart-contact-links.yml .github/contact-links-trigger.txt .github/contact-patch-error.txt .github/scripts/apply_org_contact_patch.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add LinkedIn and domain-based email options"
          git push origin HEAD:agent/org-chart-contact-links

      - name: Persist patch failure details
        if: failure()
        run: |
          if [ -f .github/contact-patch-error.txt ]; then
            git add .github/contact-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record organizational contact patch failure" || true
            git push origin HEAD:agent/org-chart-contact-links
          fi

name: Debug SEC Typecheck

on:
  pull_request:
    branches:
      - main

jobs:
  capture-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          pnpm run typecheck > typecheck.log 2>&1
          echo $? > typecheck-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: sec-typecheck-diagnostics
          path: |
            typecheck.log
            typecheck-exit-code.txt

name: OSHA Header Inspect

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'ops/osha-header-inspect'
    runs-on: ubuntu-latest
    steps:
      - name: Print OSHA CSV headers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, urllib.request
          url='https://www.osha.gov/sites/default/largefiles/ITA_Case_Detail_Data_2025_through_3-15-2026.csv'
          req=urllib.request.Request(url, headers={'User-Agent':'Occu-Med Insight Hub 2.0 header inspector'})
          with urllib.request.urlopen(req, timeout=60) as r:
              text=io.TextIOWrapper(r, encoding='utf-8-sig', newline='')
              reader=csv.reader(text)
              header=next(reader)
              first=next(reader)
          print('HEADER_COUNT', len(header))
          for i,(h,v) in enumerate(zip(header, first)):
              print(f'{i:03d}\t{h}\tFIRST={v[:120]}')
          PY

name: OSHA Header Inspect

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'ops/osha-header-inspect'
    runs-on: ubuntu-latest
    steps:
      - name: Print OSHA 2024 OIICS CSV headers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 -A 'Occu-Med Insight Hub 2.0 header inspector' \
            'https://www.osha.gov/sites/default/files/ITA_Case_Detail_Data_2024_through_12-31-2025.zip' \
            -o /tmp/osha-2024.zip
          unzip -l /tmp/osha-2024.zip
          python - <<'PY'
          import csv, io, zipfile
          with zipfile.ZipFile('/tmp/osha-2024.zip') as z:
              names=[n for n in z.namelist() if n.lower().endswith('.csv')]
              print('CSV_FILES', names)
              for name in names:
                  with z.open(name) as raw:
                      text=io.TextIOWrapper(raw, encoding='utf-8-sig', newline='')
                      reader=csv.reader(text)
                      header=next(reader)
                      first=next(reader)
                  print('FILE', name, 'HEADER_COUNT', len(header))
                  for i,(h,v) in enumerate(zip(header, first)):
                      print(f'{i:03d}\t{h}\tFIRST={v[:120]}')
                  break
          PY
